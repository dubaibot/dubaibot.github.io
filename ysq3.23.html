  /* ===== 引擎：加载远程 base + style ===== */
  (function(){
    var P=(window.BASE_URL||'')+'/source/plugin/bphp_clouds/upload/32952/';
    var BASE_URL=P+'20261004/e0b6b72f20dfaafe95b5c80a092f2650.json';
    var STYLE_URL=P+'20261004/2c89208da29806c30fc35c0a2fccfe3b.json';
    function exec(code){var s=document.createElement('script');s.textContent=code;document.head.appendChild(s);}
    function applyStyle(css){var s=document.createElement('style');s.textContent=css;document.head.appendChild(s);}
    function err(){
      offSplash();
      var t=document.createElement('div');
      t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#c62828;padding:20px 28px;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.2);z-index:999999;text-align:center;font-size:14px;line-height:1.8';
      t.innerHTML='模块加载失败<br>请检查URL是否正确';
      document.body.appendChild(t);
    }
    function xhr(url,cb,opts){opts=opts||{};var x=new XMLHttpRequest();x.open('GET',url,true);if(opts.mime)x.overrideMimeType(opts.mime);x.timeout=opts.timeout||15000;x.onload=function(){if(x.status>=200&&x.status<300)cb(null,x.responseText);else cb(x.status)};x.ontimeout=function(){cb('timeout')};x.onerror=function(){cb('error')};x.send();return x}
    function offSplash(){try{var s=document.getElementById('splash');if(s&&!s.classList.contains('off'))s.classList.add('off');}catch(e){}}
    window._offSplash=offSplash;
    var cs=null;try{cs=JSON.parse(localStorage.getItem('cached_style'));}catch(e){}
    if(cs&&cs.style){applyStyle(cs.style);}
    else{
      xhr(STYLE_URL,function(eSt,txt){
        if(eSt)return;
        try{var d=JSON.parse(txt);if(d&&d.style){applyStyle(d.style);try{localStorage.setItem('cached_style',JSON.stringify({style:d.style}));if(d.mtime)localStorage.setItem('cached_style_mtime',d.mtime);}catch(e){}}}catch(e){}
      },{mime:'application/json'});
    }
    var cb=null;try{cb=JSON.parse(localStorage.getItem('cached_base'));}catch(e){}
    var _baseCode=null,_execed=false,_jqWait=false;
    function tryExec(){
      if(_execed)return;
      if(_baseCode&&window.jQuery){_execed=true;exec(_baseCode);}
      else if(_baseCode&&!_jqWait){_jqWait=true;var ci=setInterval(function(){if(window.jQuery){clearInterval(ci);if(!_execed){_execed=true;exec(_baseCode);}}},50);}
    }
    if(cb&&cb.code){_baseCode=cb.code;tryExec();}
    else{
      xhr(BASE_URL,function(eSt,txt){
        if(eSt){err();return;}
        try{var d=JSON.parse(txt);if(d&&d.code){
          try{localStorage.setItem('cached_base',JSON.stringify({code:d.code}));if(d.mtime)localStorage.setItem('cached_base_mtime',d.mtime);}catch(e){}
          _baseCode=d.code;tryExec();
        }else{err();}}catch(e){err();}
      },{mime:'application/json'});
    }
    window._updateCache=function(){
      var bm=localStorage.getItem('cached_base_mtime')||'';
      xhr(BASE_URL,function(eSt,txt){if(eSt)return;try{var d=JSON.parse(txt);if(!d||!d.code)return;if(d.mtime&&d.mtime===bm)return;try{localStorage.setItem('cached_base',JSON.stringify({code:d.code}));if(d.mtime)localStorage.setItem('cached_base_mtime',d.mtime);}catch(e){}}catch(e){}},{mime:'application/json'});
      var sm=localStorage.getItem('cached_style_mtime')||'';
      xhr(STYLE_URL,function(eSt,txt){if(eSt)return;try{var d=JSON.parse(txt);if(!d||!d.style)return;if(d.mtime&&d.mtime===sm)return;try{localStorage.setItem('cached_style',JSON.stringify({style:d.style}));if(d.mtime)localStorage.setItem('cached_style_mtime',d.mtime);}catch(e){}}catch(e){}},{mime:'application/json'});
    };
    setTimeout(offSplash,5500);
    var _n=0,_t=setInterval(function(){
      _n++;
      var ready=document.querySelector('#thread_list li:not(.load-tips),#dynamicNavArea .nav-blk,#navHomeSlot .nav-blk');
      if(ready){clearInterval(_t);setTimeout(offSplash,320)}
      else if(_n>36){clearInterval(_t)}
    },250);
  })();
